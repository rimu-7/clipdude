name: Release ClipDude

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            name: macos-aarch64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            name: macos-x86_64
          - platform: ubuntu-22.04
            args: ""
            name: linux
          - platform: windows-latest
            args: ""
            name: windows

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable updater artifacts for CI
        run: node -e "const fs=require('fs'),p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ClipDude ${{ github.ref_name }}"
          releaseBody: |
            ## ClipDude ${{ github.ref_name }}

            ### Downloads
            - **macOS**: `.dmg` (Apple Silicon & Intel)
            - **Windows**: `.exe` (NSIS installer)
            - **Linux**: `.deb`, `.rpm`, `.AppImage`
            - **Android**: `.apk` (universal)

            ### How to Install
            - **macOS**: Download the `.dmg`, open it, drag ClipDude to Applications.
            - **Windows**: Download the `.exe` installer and run it.
            - **Linux**: Install the `.deb` with `sudo dpkg -i`, or make the `.AppImage` executable and run it.
            - **Android**: Download the `.apk` and install it (you may need to enable "Install from unknown sources").

            ### Keyboard Shortcuts
            - **macOS**: `⌘ + Shift + V` to toggle window
            - **Windows/Linux**: `Ctrl + Shift + V` to toggle window
            - **Search**: `⌘/Ctrl + K` to focus search
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  build-android:
    needs: build-desktop
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Build Android APK

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set NDK_HOME
        run: echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Cargo NDK
        run: cargo install cargo-ndk

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project
        run: pnpm tauri android init

      - name: Build APK
        run: pnpm tauri android build --apk

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find src-tauri/gen/android -name "*.apk" -path "*/release/*" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.find_apk.outputs.apk_path }}
