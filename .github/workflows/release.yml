name: Release ClipDude

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            name: macos-aarch64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            name: macos-x86_64
          - platform: ubuntu-22.04
            args: ""
            name: linux
          - platform: windows-latest
            args: ""
            name: windows

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable updater artifacts for CI
        run: node -e "const fs=require('fs'),p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ClipDude ${{ github.ref_name }}"
          releaseBody: |
            ## ClipDude ${{ github.ref_name }}

            ### Downloads
            - **macOS**: `.dmg` (Apple Silicon & Intel)
            - **Windows**: `.exe` (NSIS installer)
            - **Linux**: `.deb`, `.rpm`, `.AppImage`
            - **Android**: `.apk` (arm64 for most devices, armv7 for older devices)

            ### How to Install
            - **macOS**: Download the `.dmg`, open it, drag ClipDude to Applications.
            - **Windows**: Download the `.exe` installer and run it.
            - **Linux**: Install the `.deb` with `sudo dpkg -i`, or make the `.AppImage` executable and run it.
            - **Android**: Download the `.apk` and install it (you may need to enable "Install from unknown sources").

            ### Keyboard Shortcuts
            - **macOS**: `⌘ + Shift + V` to toggle window
            - **Windows/Linux**: `Ctrl + Shift + V` to toggle window
            - **Search**: `⌘/Ctrl + K` to focus search
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  build-android:
    needs: build-desktop
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Build Android APK

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set NDK_HOME
        run: echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Cargo NDK
        run: cargo install cargo-ndk

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project
        run: pnpm tauri android init

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore src-tauri/gen/android/release.keystore \
            -alias clipdude \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=ClipDude,O=Walter,C=US"

      - name: Configure Android signing & ABI splits
        run: |
          cd src-tauri/gen/android
          node -e "
          const fs = require('fs');
          let g = fs.readFileSync('app/build.gradle.kts', 'utf8');

          g = g.replace(
            /^(android \{)/m,
            \`signingConfigs {
              create(\"release\") {
                storeFile = file(\"../release.keystore\")
                storePassword = \"android\"
                keyAlias = \"clipdude\"
                keyPassword = \"android\"
              }
            }

            \$1\`
          );

          g = g.replace(
            /(getByName\(\"release\")\s*\{)/,
            '\$1\n            signingConfig = signingConfigs.getByName(\"release\")'
          );

          g = g.replace(
            /(\n\s*buildTypes)/,
            \`
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include(\"arm64-v8a\", \"armeabi-v7a\")
                      isUniversalApk = false
                  }
              }
          \$1\`
          );

          fs.writeFileSync('app/build.gradle.kts', g);
          console.log('Configured signing & ABI splits');
          "

      - name: Build APK
        run: pnpm tauri android build --apk

      - name: Find & rename APKs
        id: find_apk
        run: |
          mkdir -p apks
          find src-tauri/gen/android -name "*.apk" -path "*/release/*" | while read f; do
            name=$(basename "$f")
            size=$(du -h "$f" | cut -f1)
            echo "Found: $name ($size)"
            if echo "$name" | grep -q "arm64-v8a"; then
              cp "$f" "apks/ClipDude-arm64.apk"
            elif echo "$name" | grep -q "armeabi-v7a"; then
              cp "$f" "apks/ClipDude-armv7.apk"
            else
              cp "$f" "apks/ClipDude.apk"
            fi
          done
          ls -la apks/

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: apks/*.apk
